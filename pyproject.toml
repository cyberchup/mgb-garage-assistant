[project]
name = "mgb-assistant"
version = "0.1.0"
description = "Local voice-and-text assistant for a 1973 MGB Roadster."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pypdf>=6.20.1",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mgb_assistant"]

[tool.pytest.ini_options]
testpaths = ["tests"]
