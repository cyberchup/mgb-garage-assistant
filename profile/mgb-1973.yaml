# Car profile: the car as it actually sits, not as it left the factory.
# Tier 1 source. Deviations here outrank the workshop manual for the systems they affect.
# Every null is something to confirm.

systems: systems.yaml        # the system ids used below, and the words that point at them

vehicle:
  id: mgb-1973
  year: 1973
  make: MG
  model: MGB
  body: roadster
  bumpers: chrome
  engine:
    family: B-series
    displacement_cc: 1798
    engine_number: null      # read from the block plate; several specs depend on it
  chassis_number: null

goal: reliable driver, improved over time (not concours)

status:
  last_ran: 2025-10          # approximate
  notes: sitting since last run

deviations:
  - id: carb-weber
    system: fuel.carburetor
    factory_spec: twin SU HS4
    as_found: Weber 32/36, variant unknown
    confidence: believed     # confirmed | believed | unknown
    verify_by: read the stamping on the carb body
    affects: [fuel.carburetor, fuel.choke, fuel.air_filter, tuning.mixture, tuning.idle]
    demotes_tiers: [3]
    notes: choke type (manual, electric or water) depends on the variant

# Facts answers depend on that nobody has checked yet. They override nothing:
# a question touching one of these systems is told what's unknown and how to check.
unknowns:
  - id: engine-number
    what: engine number
    affects: [engine, ignition.timing]   # several specs depend on it
    check_by: read the plate on the block
  - id: weber-variant
    what: Weber variant and jetting
    affects: [fuel.carburetor, fuel.choke, tuning.mixture, tuning.idle]
    check_by: read the stamping on the carb body
  - id: ignition-type
    what: ignition type (points or electronic)
    affects: [ignition]
    check_by: lift the distributor cap and look for points or an electronic module
